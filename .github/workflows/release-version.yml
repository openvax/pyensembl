name: Release version

on:
  pull_request:

permissions:
  contents: read

jobs:
  release-version:
    name: Release version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch current main and tags
        run: git fetch origin main:refs/remotes/origin/main --tags
      - name: Check package version
        run: python scripts/check_release_version.py --base-ref origin/main
