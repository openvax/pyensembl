site_name: PyEnsembl
site_description: Query pinned genome annotations and sequences from Python
site_url: https://openvax.github.io/pyensembl/
repo_url: https://github.com/openvax/pyensembl
repo_name: openvax/pyensembl
edit_uri: blob/main/docs/
theme:
  name: material
  font: false
  palette:
    scheme: default
    primary: white
    accent: blue
  features:
    - navigation.sections
    - content.code.copy
extra_css:
  - stylesheets/docs.css
nav:
  - Home: index.md
  - First lookup: getting-started.md
  - Guides:
      - Assembly selection: guides/assembly-selection.md
      - New Ensembl platform: ensembl-platform.md
      - Custom genomes: guides/custom-genomes.md
      - Feature objects: guides/features.md
      - Gene aliases: guides/aliases.md
      - Cached data: guides/cache.md
      - Reference DNA: guides/reference-dna.md
  - Reference:
      - Overview: reference/index.md
      - Dataset constructors: reference/datasets.md
      - Genome queries: reference/genome.md
      - Feature objects: reference/features.md
      - Aliases: reference/aliases.md
      - Data and caches: reference/data.md
      - Helpers: reference/helpers.md
      - Lookup overview: reference/lookups.md
      - CLI: reference/cli.md
  - Development:
      - Contributing: dev/contributing.md
      - Documentation style: dev/documentation-style.md
      - Releasing: dev/releasing.md
plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: ["."]
          options:
            docstring_style: numpy
            show_root_heading: true
            show_root_full_path: false
            merge_init_into_class: true
            show_bases: false
            heading_level: 2
            show_source: false
            show_signature_annotations: true
            separate_signature: true
            members_order: source
            inherited_members: true
            show_if_no_docstring: true
            filters: ["!^_"]
markdown_extensions:
  - attr_list
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences
validation:
  nav:
    omitted_files: warn
    not_found: warn
  links:
    not_found: warn
    anchors: warn
    unrecognized_links: warn
