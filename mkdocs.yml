site_name: PyEnsembl
site_description: Query pinned genome annotations and sequences from Python
site_url: https://openvax.github.io/pyensembl/
repo_url: https://github.com/openvax/pyensembl
repo_name: openvax/pyensembl
edit_uri: blob/main/docs/
theme:
  name: material
  font: false
  palette:
    scheme: default
    primary: white
    accent: blue
  features:
    - navigation.indexes
    - navigation.expand
    - content.code.copy
extra_css:
  - stylesheets/docs.css
nav:
  - Home: index.md
  - Common tasks:
      - Find genes and transcripts: guides/features.md
      - Exons and coding sequences: guides/transcripts.md
      - Search gene aliases: guides/aliases.md
      - Read genomic DNA: guides/reference-dna.md
  - Reference data:
      - Choose a reference: guides/assembly-selection.md
      - Install and manage data: guides/cache.md
      - Use your own annotations: guides/custom-genomes.md
      - Use dated Ensembl annotations: ensembl-platform.md
  - API reference:
      - reference/index.md
      - Select data: reference/datasets.md
      - Query a genome: reference/genome.md
      - Genes, transcripts and exons: reference/features.md
      - Gene name aliases: reference/aliases.md
      - Data and indexing: reference/data.md
      - Species and reference helpers: reference/helpers.md
      - Command line: reference/cli.md
  - Contributing:
      - dev/contributing.md
      - Documentation style: dev/documentation-style.md
      - Releasing: dev/releasing.md
exclude_docs: |
  /getting-started.md
plugins:
  - search
  - redirects:
      redirect_maps:
        getting-started.md: index.md
        reference/lookups.md: reference/genome.md
  - mkdocstrings:
      handlers:
        python:
          paths: ["."]
          options:
            docstring_style: numpy
            show_root_heading: true
            show_root_full_path: false
            merge_init_into_class: true
            show_bases: false
            heading_level: 2
            show_source: false
            show_signature_annotations: true
            separate_signature: true
            members_order: source
            inherited_members: true
            show_if_no_docstring: true
            filters: ["!^_"]
markdown_extensions:
  - attr_list
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true
validation:
  nav:
    omitted_files: warn
    not_found: warn
  links:
    not_found: warn
    anchors: warn
    unrecognized_links: warn
