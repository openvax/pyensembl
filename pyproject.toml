[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pyensembl"
dynamic = ["version"]
description = "Python interface to Ensembl reference genome metadata"
authors = [
    {name = "Alex Rubinsteyn", email = "alex.rubinsteyn@unc.edu"}
]
license = "Apache-2.0"
readme = "README.md"
requires-python = ">=3.9"
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "typechecks>=0.0.2,<1.0.0",
    "datacache>=1.10.0,<2.0.0",
    "memoized-property>=1.0.2",
    "tinytimer>=0.0.0,<1.0.0",
    "gtfparse>=2.7.0,<3.0.0",
    "serializable>=0.2.1,<2.0.0",
    "numpy>=2.0.0,<3.0.0",
    "pyfaidx>=0.8.1,<1.0.0",
    # 3.24+ lets umask and default ACLs set lock file modes (shared caches).
    "filelock>=3.24,<4.0.0; python_version>='3.10'",
    "filelock>=3.12,<4.0.0; python_version<'3.10'",
]

[project.scripts]
pyensembl = "pyensembl.shell:run"

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
    "build",
]

[tool.setuptools]
packages = ["pyensembl"]

[tool.setuptools.dynamic]
version = {attr = "pyensembl.version.__version__"}

[tool.ruff.lint]
# Ruff 0.16 widened its default rule set; keep the rules this repo has always used.
select = ["E4", "E7", "E9", "F"]
